# MetalLB installation
#
# This installs MetalLB using the official manifests.
# For the latest version, check: https://metallb.universe.tf/installation/
#
# Apply with: kubectl apply -f metallb.yaml
#
# After applying, configure the IP pool in config.yaml

apiVersion: v1
kind: ConfigMap
metadata:
  name: metallb-install-info
  namespace: metallb-system
data:
  install-method: |
    # Install MetalLB via official manifests:
    # kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/v0.14.5/config/manifests/metallb-native.yaml
    #
    # Or via Helm:
    # helm repo add metallb https://metallb.github.io/metallb
    # helm install metallb metallb/metallb -n metallb-system

---
# To install, run:
# kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/v0.14.5/config/manifests/metallb-native.yaml

